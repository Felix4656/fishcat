<head>

<style>
:root{--ink:#fff;--panel:rgba(8,40,70,.82);--accent:#ffb347}

html,body{height:100%;margin:0;overflow:hidden;background:#0b4f7a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0;font-weight:700;font-size:clamp(16px,4vw,24px);text-shadow:0 2px 4px rgba(0,0,0,.4);pointer-events:none}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,20,40,.35)}
#card{background:var(--panel);border-radius:20px;padding:24px 28px;max-width:340px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.4)}

#card p{margin:6px 0;line-height:1.4;font-size:15px;opacity:.95}
button{margin-top:14px;font:inherit;font-weight:700;font-size:18px;padding:12px 32px;border:0;border-radius:30px;background:var(--accent);color:#3a1c00;cursor:pointer}
#hud{font-size:clamp(12px,3.3vw,22px);gap:6px}
#mute{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 42px);width:40px;height:40px;border-radius:50%;margin:0;padding:0;font-size:20px;background:var(--panel);color:#fff;z-index:5}
button.sec{background:#fff;color:#07304f;margin-left:6px}
#shop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,20,40,.6);z-index:6}
#shop .pn{background:var(--panel);border-radius:20px;padding:18px;width:min(92vw,420px);max-height:86%;overflow:auto;touch-action:pan-y;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#shop h1{margin:0;font-size:24px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px;margin-top:10px}
.it{background:rgba(255,255,255,.1);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px}
.it.sel{outline:2px solid var(--accent)}
.sw{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:26px}
.it button{margin:0;font-size:13px;padding:6px 12px;width:100%}
#menuB{position:fixed;left:10px;top:calc(env(safe-area-inset-top,0px) + 42px);display:none;margin:0;padding:8px 14px;font-size:14px;border-radius:20px;background:var(--panel);color:#fff;z-index:5}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 80px);transform:translateX(-50%);background:var(--accent);color:#3a1c00;font-weight:700;padding:10px 18px;border-radius:24px;opacity:0;transition:opacity .3s;z-index:9;pointer-events:none;white-space:nowrap;max-width:94vw;font-size:15px}
#achp{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,20,40,.6);z-index:6}
#achp .pn{background:var(--panel);border-radius:20px;padding:18px;width:min(92vw,420px);max-height:86%;overflow:auto;touch-action:pan-y;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#achp h1{margin:0;font-size:24px}
#alist{text-align:left;margin-top:8px}
.ai{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;background:rgba(255,255,255,.08);margin-bottom:6px;opacity:.55}
.ai.ok{opacity:1;background:rgba(255,179,71,.22)}
.ai>div{flex:1;font-size:14px}.ai small{opacity:.8}.ai i{font-style:normal;font-size:13px;white-space:nowrap}
#bfx{position:fixed;left:10px;top:calc(env(safe-area-inset-top,0px) + 86px);display:flex;flex-direction:column;gap:4px;pointer-events:none}
.bd{background:var(--panel);border-radius:14px;padding:3px 10px;font-weight:700;font-size:15px}
#fixp{font-size:14px}
#tmr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 38px);transform:translateX(-50%);font-weight:700;font-size:clamp(18px,5vw,28px);text-shadow:0 2px 4px rgba(0,0,0,.4);pointer-events:none}

</head>

let S={coins:0,owned:['orange'],skin:'orange',mute:false,ach:{},tot:{food:0,games:0,heart:0,esc:0}};

S.ach=S.ach||{};S.tot=Object.assign({food:0,games:0,heart:0,esc:0},S.tot);
function wealth(s){return (+s.coins||0)+(Array.isArray(s.owned)?s.owned:[]).reduce((n,id)=>n+((SK.find(k=>k.id===id)||{p:0}).p),0)}
function mergeSave(a,b){
  const m=Object.assign({},a),at=a.tot||{},bt=b.tot||{};
  m.ach=Object.assign({},b.ach,a.ach);m.tot=Object.assign({},bt,at);
  for(const k in bt)m.tot[k]=Math.max(+bt[k]||0,+at[k]||0);
  if(!Array.isArray(m.owned)||!m.owned.includes('orange'))m.owned=['orange'];
  return m;
}
function save(){
  try{
    let o=null;try{o=JSON.parse(localStorage.getItem('fishcat_save'))}catch(e){}
    if(o&&typeof o==='object'&&o.tot)S=wealth(o)>wealth(S)?mergeSave(o,S):mergeSave(S,o);
    localStorage.setItem('fishcat_save',JSON.stringify(S));
  }catch(e){}
  const c=$('cn');if(c)c.textContent='\ud83e\ude99 '+S.coins;
}
addEventListener('storage',e=>{
  if(e.key!=='fishcat_save'||!e.newValue)return;
  try{const o=JSON.parse(e.newValue);if(o&&o.tot&&wealth(o)>wealth(S)){S=mergeSave(o,S);upd()}}catch(_){}
});

const BNK=Object.keys(BN);
function takeBonus(k,x,y){
  R.b[k]=BN[k].t;S.tot.bon=(S.tot.bon||0)+1;S.tot['b_'+k]=(S.tot['b_'+k]||0)+1;R.kinds|=1<<BNK.indexOf(k);
  if(k==='freeze'&&dogs.length>=3)R.chill=1;
  sfx('bonus');pop(x,y,'#fff');save();
}
function updBonus(){
  $('tmr').textContent=fmt(t||0);
  if(state!=='play'){$('bfx').innerHTML='';return}
  $('bfx').innerHTML=BNK.filter(k=>R.b[k]>0).map(k=>`<div class='bd'>${BN[k].e} ${Math.ceil(R.b[k])}</div>`).join('');

const FX={sparkle:['\u2728',.55],hearts:['\u2764\ufe0f',.5],stars:['\u2b50',.5],snow:['\u2744\ufe0f',.5],notes:['\ud83c\udfb5',.55],petals:['\ud83c\udf38',.5],flame:[null,0,'#ff8a2a'],bubble:[null,0,'#d8f4ff'],glow:[null,0,'#fff59a']};
function emitFx(dt){
  const sk=SK.find(s=>s.id===S.skin);if(!sk||!sk.fx||Math.random()>dt*16)return;
  const f=FX[sk.fx],up=['flame','hearts','bubble','notes'].includes(sk.fx)?-1:(sk.fx==='snow'||sk.fx==='petals')?1:0;

        let bf=null,bd=1e9;for(const f of foods){if(f.heart)continue;const q=Math.hypot(f.x-d.x,f.y-d.y);if(q<bd&&f.x>0&&f.x<W&&f.y>0&&f.y<H){bd=q;bf=f}}
        if(pd<U*4)d.atk=1.5;
        else if(bf){ddx=bf.x-d.x;ddy=bf.y-d.y;if(bd<U*1.2){foods.splice(foods.indexOf(bf),1);d.steal++;S.tot.stolen=(S.tot.stolen||0)+1;pop(bf.x,bf.y,'#f66');if(d.steal>=2)d.leave=true}}
        else d.atk=.8;
      }
    }
    if(d.dash>0&&!d.leave&&d.kind!==3&&Math.hypot(d.vx,d.vy)>1){ddx=d.vx;ddy=d.vy}
    if(!free){const dd=Math.hypot(ddx,ddy)||1;d.vx+=(ddx/dd*spd-d.vx)*tr;d.vy+=(ddy/dd*spd-d.vy)*tr}
    d.x+=d.vx*dt*(R.b.freeze>0?.3:1);d.y+=d.vy*dt*(R.b.freeze>0?.3:1);d.d=d.vx>=0?1:-1;
    if(R.b.shield>0){if(!d.bit&&Math.hypot(d.x-p.x,(d.y-p.y)*1.3)<d.sz+U*1.2){R.blocked++;d.leave=true;d.bit=true;d.vx*=-1.5;d.vy*=-1.5;sfx('click');pop(d.x,d.y,'#8ff')}}
    else if(inv<=0&&Math.hypot(d.x-p.x,(d.y-p.y)*1.3)<d.sz+U*.7){
      lives--;sfx('hit');inv=1.6;d.vx*=-1.5;d.vy*=-1.5;d.dt=3;d.dash=0;d.leave=true;d.bit=true;R.hits++;R.clean=0;S.tot.bites=(S.tot.bites||0)+1;pop(p.x,p.y,'#ff6b6b');upd();
      if(lives<=0){endGame();return}
    }
    if(d.leave&&(d.x<-U*4||d.x>W+U*4||d.y<-U*4||d.y>H+U*4)){if(!d.bit){R.esc++;S.tot.esc++}dogs.splice(i,1)}
  }
  emitFx(dt);for(const b of bubbles){b.y-=b.s*dt;if(b.y<-10){b.y=H+10;b.x=Math.random()*W}}
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt;if(q.l<=0)parts.splice(i,1)}
}

function ellipse(x,y,rx,ry,col){ctx.fillStyle=cmap&&cmap[col]||col;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fill()}
function tri(a,b,c,d,e,f,col){ctx.fillStyle=cmap&&cmap[col]||col;ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.lineTo(e,f);ctx.closePath();ctx.fill()}

function drawCat(x,y,s,d){
  const sk=curSkin();cmap={'#ff8a3d':sk.b,'#ffa04d':sk.a,'#ffe0b8':sk.c};
  ctx.save();ctx.translate(x,y);ctx.scale(d,1);
  ctx.globalAlpha=sk.al||1;const wag=Math.sin(t*10)*s*.15;
  tri(-s*.8,0,-s*1.6,-s*.6+wag,-s*1.6,s*.6+wag,'#ff8a3d');
  ellipse(0,0,s,s*.7,'#ffa04d');
  ellipse(s*.1,s*.3,s*.6,s*.3,'#ffe0b8');
  tri(s*.1,-s*.55,s*.3,-s*1.1,s*.6,-s*.5,'#ff8a3d');
  tri(s*.5,-s*.45,s*.85,-s*.95,s*.9,-s*.2,'#ff8a3d');
  ellipse(s*.55,-s*.1,s*.2,s*.22,'#fff');ellipse(s*.62,-s*.1,s*.1,s*.15,'#222');
  tri(s*.9,s*.05,s*1.05,s*.05,s*.97,s*.18,'#e0566b');
  ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.beginPath();
  ctx.moveTo(s*.9,s*.15);ctx.lineTo(s*1.4,s*.05);ctx.moveTo(s*.9,s*.2);ctx.lineTo(s*1.4,s*.25);ctx.stroke();cmap=null;
  ctx.restore();
}
function drawDog(x,y,s,d,a){
  ctx.save();ctx.translate(x,y);ctx.scale(d,1);ctx.rotate(a||0);
  const wag=Math.sin(t*12+x)*s*.15;
  tri(-s*.8,0,-s*1.5,-s*.5+wag,-s*1.5,s*.5+wag,'#6b6f8a');
  ellipse(0,0,s,s*.7,'#8d92b0');
  ellipse(s*.1,s*.3,s*.6,s*.3,'#c9cde0');
  ellipse(s*.35,-s*.45,s*.3,s*.55,'#4a4d66');
  ellipse(s*.55,-s*.1,s*.2,s*.22,'#fff');ellipse(s*.62,-s*.08,s*.1,s*.13,'#c00');
  ctx.strokeStyle='#222';ctx.lineWidth=2.5;ctx.beginPath();
  ctx.moveTo(s*.35,-s*.32);ctx.lineTo(s*.8,-s*.12);ctx.stroke();
  ellipse(s*1.0,0,s*.14,s*.11,'#222');
  tri(s*.75,s*.3,s*.85,s*.55,s*.95,s*.3,'#fff');
  tri(s*.95,s*.3,s*1.05,s*.55,s*1.15,s*.3,'#fff');
  ctx.restore();
}

function draw(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#3aa8d8');g.addColorStop(1,'#0b3d66');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.07)';
  for(let i=0;i<4;i++){const y=H*(.15+i*.22)+Math.sin(t+i)*8;ctx.fillRect(0,y,W,U*.5)}
  ctx.fillStyle='rgba(255,255,255,.35)';
  for(const b of bubbles){ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill()}
  for(const f of foods){if(f.bn&&!f.heart){const k=1+Math.sin(t*8)*.1;ctx.fillStyle='rgba(255,255,255,.88)';ctx.beginPath();ctx.arc(f.x,f.y,U*.8*k,0,7);ctx.fill();ctx.font=Math.round(U*.95)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#222';ctx.fillText(BN[f.bn].e,f.x,f.y+1);continue}if(f.heart){const k=1+Math.sin(t*8)*.12;ctx.font=Math.round(U*1.1*k)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('❤️',f.x,f.y);continue}ellipse(f.x,f.y,U*.35,U*.35,'#ffd54a');ellipse(f.x-U*.1,f.y-U*.1,U*.12,U*.12,'#fff6c2')}
  for(const d of dogs){
    const tl=d.kind===3&&d.st===1&&!d.leave,ax=tl?Math.cos(d.aim):d.vx,ay=tl?Math.sin(d.aim):d.vy;cmap=d.kind===4?DOGB:null;drawDog(d.x,d.y,d.sz*(d.dash>0||d.st===1?1.15:1),ax>=0?1:-1,Math.atan2(ay,Math.abs(ax)));cmap=null;
    if(d.kind===3&&d.st===1&&!d.leave){ctx.font=Math.round(U*1.6)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('\u2757',d.x,d.y-d.sz-U*.8)}
  }
  if(state!=='over'&&!(inv>0&&Math.floor(inv*10)%2))drawCat(p.x,p.y,U*.85,dir);
  if(state!=='over'){const hk=SK.find(s=>s.id===S.skin);if(hk&&hk.halo){ctx.strokeStyle='#ffe066';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(p.x+dir*U*.3,p.y-U*1.1,U*.45,U*.15,0,0,7);ctx.stroke()}if(R.b.shield>0&&(R.b.shield>1.5||Math.floor(t*8)%2)){ctx.strokeStyle='rgba(140,255,255,.9)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,U*1.6,0,7);ctx.stroke()}if(R.b.magnet>0){ctx.strokeStyle='rgba(255,120,120,.35)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,U*8,0,7);ctx.stroke()}if(R.b.freeze>0){ctx.fillStyle='rgba(150,220,255,.14)';ctx.fillRect(0,0,W,H)}}
  for(const q of parts){ctx.globalAlpha=Math.max(Math.min(q.l*2,1),0);if(q.e){ctx.font=Math.round(U*(q.s||.6))+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(q.e,q.x,q.y)}else ellipse(q.x,q.y,U*(q.r||.15),U*(q.r||.15),q.c)}
  ctx.globalAlpha=1;
  if(touchDev&&state==='play')drawJoy();
}

let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,.05);last=now;
  if(state==='play')update(dt);else t+=dt;
  if(p||state==='play')draw();
  else{reset();draw()}
  requestAnimationFrame(loop);
}
reset();requestAnimationFrame(loop);
</script>
